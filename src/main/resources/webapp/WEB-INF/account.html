<!doctype html>
<html
    lang="en"
    xmlns:th="http://www.thymeleaf.org"
>
    <head>
        <title>@account</title>
        <meta
            http-equiv="Content-Type"
            content="text/html; charset=UTF-8"
        />
        <link
            th:href="@{~/css/account.css}"
            rel="stylesheet"
        />

        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        />
    </head>

    <body>
        <div id="content">
            <header>
                <div id="header-container">
                    <div>
                        <a>Account</a>
                    </div>

                    <div>
                        <a th:text="${#temporals.monthName(yearAndMonth)}"
                            >May</a
                        >
                        <a th:text="${#temporals.year(yearAndMonth)}">2026</a>
                    </div>

                    <div id="header-buttons">
                        <button onclick="showMakeExpenseDialog()">
                            Expense
                        </button>
                        <button onclick="showMakeIncomeDialog()">Income</button>
                    </div>
                </div>
            </header>

            <main>
                <div id="main-container">
                    <div id="dashboard">
                        <div class="dashboard-sub">
                            <span>Total operations</span>
                            <span th:text="${daily.count}">10</span>
                        </div>

                        <div class="dashboard-sub">
                            <span>Income</span>
                            <span
                                th:text="${#numbers.formatDecimal(daily.incomeAmount, 1, 2)}"
                                >$100</span
                            >
                        </div>

                        <div class="dashboard-sub">
                            <span>Expenses</span>
                            <span
                                th:text="${#numbers.formatDecimal(daily.expenseAmount, 1, 2)}"
                                >$100</span
                            >
                        </div>
                    </div>

                    <div id="details">
                        <div
                            class="accordion"
                            th:if="not ${#lists.isEmpty(daily.days)}"
                        >
                            <div
                                th:each="day, dayStatus : ${daily.days}"
                                class="accordion-item"
                                th:classappend="not ${dayStatus.first} ? 'collapsed'"
                            >
                                <div class="accordion-header">
                                    <i class="fa fa-solid fa-angle-right"></i>
                                    <span
                                        th:text="${#temporals.format(day, 'yyyy-MM-dd')}"
                                        >2019-05-01</span
                                    >
                                </div>

                                <div class="accordion-collapsable">
                                    <div class="accordion-body">
                                        <table>
                                            <thead>
                                                <tr>
                                                    <th>Description</th>
                                                    <th
                                                        class="text-center"
                                                        style="width: 10em"
                                                    >
                                                        Amount
                                                    </th>
                                                    <th
                                                        class="text-center"
                                                        style="width: 15em"
                                                    >
                                                        Category
                                                    </th>
                                                    <th
                                                        class="text-center"
                                                        style="width: 8%"
                                                    >
                                                        Actions
                                                    </th>
                                                </tr>
                                            </thead>

                                            <tbody>
                                                <tr
                                                    th:classappend="*{type.displayName}"
                                                    th:each="transaction : ${daily.day(day)}"
                                                    th:object="${transaction}"
                                                    th:data-type="*{type.displayName}"
                                                    th:data-id="*{id}"
                                                >
                                                    <td
                                                        th:text="*{description}"
                                                    >
                                                        About
                                                    </td>
                                                    <td class="text-center">
                                                        <span
                                                            th:classappend="*{type.displayName} eq 'expense' ? 'text-expense' : (*{type.displayName} eq 'income' ? 'text-income')"
                                                            th:text="*{#numbers.formatDecimal(amount, 1, 2)}"
                                                            >$300
                                                        </span>
                                                    </td>
                                                    <td class="text-center">
                                                        <span
                                                            class="text-wrap"
                                                            th:text="*{category}"
                                                        >
                                                            Category
                                                        </span>
                                                    </td>
                                                    <td class="text-center">
                                                        <button onclick="deleteCard(event)">
                                                            <i
                                                                class="fa fa-trash"
                                                            ></i>
                                                        </button>
                                                    </td>
                                                </tr>
                                            </tbody>

                                            <tfoot>
                                                <tr>
                                                    <td>Total:</td>
                                                    <td class="text-center">
                                                        <span
                                                            th:text="${#numbers.formatDecimal(daily.amount(day), 1, 2)}"
                                                        >
                                                            300
                                                        </span>
                                                    </td>
                                                </tr>
                                            </tfoot>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>

            <footer>Fixed footer or something else</footer>
        </div>
    </body>

    <script
        type="text/javascript"
        th:src="@{~/js/account.js}"
    ></script>

    <script
        type="text/javascript"
        th:src="@{~/js/lib/jquery-4.0.0.min.js}"
    ></script>
</html>
