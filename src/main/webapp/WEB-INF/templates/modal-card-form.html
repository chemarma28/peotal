<div
    class="modal"
    id="modal-card-form"
>
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <span>New Expense Card</span>
                </div>
            </div>
            <div class="modal-body">
                <form
                    id="card-form"
                    th:fragment="card-form"
                    autocomplete="off"
                    hx-post=""
                    hx-target="this"
                    hx-swap="outerHTML"
                >
                    <div
                        th:fragment="card-amount-field"
                        class="form-input-container"
                        th:classappend="${form.hasError('cardAmount')} ? 'error'"
                        hx-target="this"
                        hx-swap="outerHTML"
                    >
                        <div class="form-input">
                            <label for="cardAmount">Amount</label>
                            <input
                                id="form-card-amount"
                                name="cardAmount"
                                placeholder="Amount..."
                                hx-post="/hx/forms/card/cardAmount"
                                th:value="${form.lastValue('cardAmount')}"
                                required
                            />
                        </div>
                        <div
                            class="form-input-err-msg"
                            th:if="${form.hasError('cardAmount')}"
                        >
                            <ul>
                                <li
                                    th:each="error : ${form.errors('cardAmount')}"
                                    th:text="${error}"
                                ></li>
                            </ul>
                        </div>
                    </div>

                    <div
                        th:fragment="cardDate"
                        class="form-input-container"
                    >
                        <div class="form-input">
                            <label for="cardDate">Date</label>
                            <input
                                id="form-card-date"
                                name="cardDate"
                                type="date"
                                th:value="${form.lastValue('cardDate')}"
                                required
                            />
                        </div>
                    </div>

                    <div class="form-input"></div>

                    <div
                        class="form-error-msg"
                        th:if="${form.hasAnyErrors()}"
                    >
                        Form submission failed. Ensure all fields are correctly
                        filled.
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <div class="control">
                    <button
                        class="btn"
                        onclick="Modal.close('modal-card-form')"
                    >
                        Cancel
                    </button>
                    <button
                        type="submit"
                        form="card-form"
                        class="btn btn-primary"
                    >
                        Save
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
