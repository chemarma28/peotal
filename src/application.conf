flyway {
    locations = ["classpath:db"],
    cleanDisabled = false
    run = [migrate]
}

db {
    url = ${?PEOTAL_DB_URL}
    user = ${?PEOTAL_DB_USER}
    password = ${?PEOTAL_DB_PASSWORD}
}

auth {
    jwt {
        secret = ${?PEOTAL_JWT_SECRET}
        ttl = 1d
    }
    bootstrap {
        username = ${?PEOTAL_USERNAME}
        password = ${?PEOTAL_PASSWORD}
    }
    cookie {
        secure = false
    }
}

server {
    port = 9097
}