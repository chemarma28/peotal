<div
    class="modal"
    _="on modal:close add .fade-out then wait for animationend then remove me"
>
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <span>New Expense Card</span>
                </div>
            </div>
            <div class="modal-body">
                <form
                    id="card-form"
                    th:object="${expenseCardForm}"
                    th:fragment="card-form"
                    autocomplete="off"
                    th:hx-post="@{~/hx/forms/card}"
                    hx-target="this"
                    hx-swap="outerHTML"
                >
                    <div
                        class="field-detail"
                        th:classappend="*{hasErrors('cardAmount')} ? 'failed'"
                    >
                        <div class="field-control">
                            <label for="cardAmount">Amount</label>
                            <input
                                th:field="cardAmount"
                                placeholder="How much?"
                            />
                        </div>
                        <div class="field-errors">
                            <ul>
                                <li
                                    th:each="error : *{errors('cardAmount')}"
                                    th:text="${error}"
                                ></li>
                            </ul>
                        </div>
                    </div>

                    <div class="field-detail">
                        <div class="field-control">
                            <label for="cardDate">Date</label>
                            <input
                                type="date"
                                th:field="cardDate"
                            />
                        </div>

                        <div class="field-errors"></div>
                    </div>

                    <div class="field-detail">
                        <div class="field-control">
                            <label for="cardDescription">Description</label>
                            <textarea
                                th:field="cardDescription"
                                placeholder="What kind of expense?"
                                rows="3"
                                style="width: 268px; resize: none"
                            ></textarea>
                        </div>
                        <div class="field-errors">
                            <ul>
                                <li></li>
                            </ul>
                        </div>
                    </div>

                    <div
                        th:if="not *{isValid}"
                        class="form-errors"
                    >
                        Form submission failed. Ensure all fields are filled
                        correctly
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <div class="modal-control">
                    <button
                        class="btn"
                        _="on click trigger modal:close"
                    >
                        Cancel
                    </button>
                    <button
                        type="submit"
                        form="card-form"
                        class="btn btn-primary"
                    >
                        Save
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
