plugins {
    id 'application'
    id 'java'
}

version = "0.1.0"

def requiredJava = JavaVersion.VERSION_21
def currentJava = JavaVersion.current()

if (currentJava != requiredJava) {
    throw new GradleException(
            "Peotal requires JDK 21. " +
            "Current Gradle JVM: ${currentJava} " +
            "(${System.getProperty('java.version')}, ${System.getProperty('java.home')}). " +
            "Set JAVA_HOME to JDK 21 or configure Gradle JVM in your IDE."
    )
}

sourceSets {
    main {
        java {
            srcDirs = ["src"]
        }
        
        resources {
            srcDirs = ["src"]
            exclude "**/*.java"
        }
    }

    test {
        java {
            srcDirs = ["test"]
        }
    }
}

processResources {
    includeEmptyDirs = false
    
    from('db') {
        into 'db'
    }
}

application {
    mainClass = 'Launcher'
}

test {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-parameters']
    options.release = 21
}

repositories {
    mavenCentral()
    maven { url = uri("https://jitpack.io") }
}

configurations {
    jvm2dts
}

dependencies {
    def joobyVersion = "4.5.4"

    implementation "com.h2database:h2:2.3.232"
    implementation "io.jooby:jooby:${joobyVersion}"
    implementation "io.jooby:jooby-netty:${joobyVersion}"
    implementation "io.jooby:jooby-logback:${joobyVersion}"
    implementation "io.jooby:jooby-flyway:${joobyVersion}"
    implementation "io.jooby:jooby-jdbi:${joobyVersion}"
    implementation "com.google.code.gson:gson:2.14.0"
    implementation "io.jooby:jooby-avaje-inject:${joobyVersion}"
	
    compileOnly "org.projectlombok:lombok:1.18.46"
	annotationProcessor "org.projectlombok:lombok:1.18.46"

    annotationProcessor "io.avaje:avaje-inject-generator:12.6"
    annotationProcessor "io.jooby:jooby-apt:${joobyVersion}"

	testCompileOnly "org.projectlombok:lombok:1.18.46"
	testAnnotationProcessor "org.projectlombok:lombok:1.18.46"

    testImplementation platform("org.junit:junit-bom:6.1.3")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"

    jvm2dts "com.github.keksworks:jvm2dts:1.9.1"
}

jar {
    manifest {
        attributes "Main-Class": application.mainClass
    }

    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.register("types") {
    group = "build"
    description = "Generate ui/src/types.ts from Java model classes"

    dependsOn "classes"

    def outputFile = layout.projectDirectory.file("ui/src/types.ts")
    def classesDirProvider = layout.buildDirectory.dir("classes/java/main")
    def packages = ["categories", "transactions"] as Set
    def generatorClasspath = configurations.jvm2dts
    def runtimeClasspath = sourceSets.main.runtimeClasspath

    doLast {
        def classesDir = classesDirProvider.get().asFile
        def urls = (generatorClasspath.files + runtimeClasspath.files)
                .collect { it.toURI().toURL() } as URL[]
        def loader = new URLClassLoader(urls, (ClassLoader) null)

        try {
            // jvm2dts.Main hardcodes '/' when converting class paths to class
            // names. On Windows Path.toString() uses '\', so Main silently
            // produces an empty file. Reuse its converter but normalize both
            // separators in the class file walk below.
            def converterClass = loader.loadClass("jvm2dts.Converter")
            def mapperClass = loader.loadClass("jvm2dts.TypeMapper")
            def mapper = mapperClass.getConstructor(Map.class).newInstance([:] as Map)
            def converter = converterClass.getConstructor(mapperClass).newInstance(mapper)
            def convert = converterClass.getMethod("convert", Class.class)

            def classNames = []
            classesDir.eachFileRecurse(groovy.io.FileType.FILES) { file ->
                if (!file.name.endsWith(".class")) {
                    return
                }

                def relative = classesDir.toPath().relativize(file.toPath()).toString()
                def className = relative
                        .substring(0, relative.length() - ".class".length())
                        .replace('/', '.')
                        .replace('\\', '.')

                def dot = className.lastIndexOf('.')
                def packageName = dot > 0 ? className.substring(0, dot) : ""

                if (packages.isEmpty() || packages.contains(packageName)) {
                    classNames << className
                }
            }

            classNames.sort()

            def output = new StringBuilder()
            classNames.each { className ->
                def type = Class.forName(className, false, loader)
                def data = type.isEnum() || type.isInterface()

                if (!data) {
                    try {
                        type.getDeclaredMethod("equals", Object.class)
                        data = true
                    } catch (NoSuchMethodException ignored) {
                        // not a data class
                    }
                }

                if (data) {
                    def converted = convert.invoke(converter, type)

                    if (converted != null) {
                        output.append("// ").append(className).append('\n')
                        output.append("export ").append(converted).append('\n')
                    }
                }
            }

            outputFile.asFile.text = output.toString()
        } finally {
            loader.close()
        }
    }
}

tasks.named("classes") {
    finalizedBy "types"
}