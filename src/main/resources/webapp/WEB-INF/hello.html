<!doctype html>
<html
    lang="en"
    xmlns:th="http://www.thymeleaf.org"
>
    <head>
        <title>@account</title>
        <meta
            http-equiv="Content-Type"
            content="text/html; charset=UTF-8"
        />

        <link
            th:href="@{~/css/hello.css}"
            rel="stylesheet"
        />

        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        />
    </head>

    <body>
        <div id="welcome">
            <div id="title">
                <h1>Sign in</h1>
            </div>

            <div id="form-section">
                <form id="credentials" name="credentials" th:object="${form}" method="POST" th:action="@{~/hello.html}">
                    <div class="form-group">
                        <div>
                            <label for="username">Username</label>
                        </div>

                        <input th:field="username" autocomplete="on" placeholder="Who are you?"></input>

                        <div class="failures">
                            <th:block th:each="error : *{errors('username')}">
                                <span>
                                    <i class="fa-solid fa-circle-exclamation"></i>
                                    <span th:text="${error}"></span>
                                </span>
                            </th:block>
                        </div>
                    </div>

                    <div class="form-group">
                        <div>
                            <label for="password">Password</label>
                        </div>

                        <input th:field="password" type="password" autocomplete="on" placeholder="Shhh..."></input>

                        <div class="failures">
                            <th:block th:each="error : *{errors('password')}">
                                <span>
                                    <i class="fa-solid fa-circle-exclamation"></i>
                                    <span th:text="${error}"></span>
                                </span>
                            </th:block>
                        </div>
                    </div>

                    <div  class="form-group">
                        <div class="failures">
                            <th:block th:each="error : *{errors}">
                                <span>
                                    <i class="fa-solid fa-circle-exclamation"></i>
                                    <span th:text="${error}"></span>
                                </span>
                            </th:block>
                        </div>
                    </div>
                </form>
            </div>

            <div id="button">
                <button type="submit" form="credentials">Sign in</button>
            </div>
        </div>
    </body>

    <script
        type="text/javascript"
        th:src="@{~/js/account.js}"
    ></script>

    <script
        type="text/javascript"
        th:src="@{~/js/lib/jquery-4.0.0.min.js}"
    ></script>
</html>
