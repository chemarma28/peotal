<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Finance</title>
        <meta
            http-equiv="Content-Type"
            content="text/html; charset=UTF-8"
        />
        <link
            rel="stylesheet"
            type="text/css"
            th:href="@{~/css/finance.index.css}"
        />
        <link
            rel="stylesheet"
            type="text/css"
            th:href="@{~/libcss/toastify.min.css}"
        />

        <script type="text/hyperscript">
            behavior Collapsable(parent)
                on accordion:collapse
                    if parent match .collapsed
                        measure my scrollHeight then set my.style.maxHeight to `${scrollHeight}px`
                    else
                        set my.style.maxHeight to '0px'
                    end
                    then toggle .collapsed on parent
            end
        </script>
    </head>

    <body>
        <div id="layout">
            <div id="layout-header">
                <div>
                    <a>Office name</a>
                </div>

                <div>
                    <span>Balance: <b>200$</b></span>
                </div>

                <div id="header-buttons">
                    <button
                        class="btn"
                        hx-get="/hx/forms/income?modal"
                        hx-target="#modal-root"
                        hx-swap="innerHTML"
                    >
                        Income
                    </button>
                    <button
                        class="btn"
                        hx-get="/hx/forms/card?modal"
                        hx-target="#modal-root"
                        hx-swap="innerHTML"
                    >
                        New Expense
                    </button>
                </div>
            </div>

            <div id="layout-menu">
                <div
                    id="menu"
                    th:fragment="menu"
                >
                    <div class="menu-tab">
                        <div>Months</div>
                        <div>Amount</div>
                        <div>Income</div>
                    </div>

                    <div
                        th:each="info,it : ${infos}"
                        th:if="${not it.last}"
                        class="menu-tab"
                        th:classappend="${monthParam eq #temporals.month(info.monthDate)} ? 'tab-selected'"
                        hx-trigger="click"
                        hx-target="#card-item-accordion"
                        hx-swap="outerHTML"
                        th:hx-get="|/html/dashboard?year=${#temporals.year(info.monthDate)}&month=${#temporals.month(info.monthDate)}|"
                    >
                        <div th:text="${#temporals.monthName(info.monthDate)}">
                            January
                        </div>
                        <div>
                            <span
                                class="outlined"
                                th:text="${#numbers.formatDecimal(info.amount, 1, 2, 'POINT')}"
                                >100.0</span
                            >
                        </div>
                        <div>
                            <span
                                class="outlined"
                                th:text="${#numbers.formatDecimal(info.income, 1, 2, 'POINT')}"
                                >100.0</span
                            >
                        </div>
                    </div>

                    <div class="menu-tab">
                        <div>Total:</div>
                        <div
                            th:text="${#numbers.formatDecimal(infos.last.amount, 1, 2, 'POINT')}"
                        >
                            155.0
                        </div>
                        <div
                            th:text="${#numbers.formatDecimal(infos.last.income, 1, 2, 'POINT')}"
                        >
                            350.0
                        </div>
                    </div>
                </div>

                <div class="year-buttons">
                    <div><span>Years</span></div>

                    <div
                        class="button-switch"
                        _="on radio:say toggle .down on the .down in me then toggle .down on target"
                    >
                        <button _="on click trigger radio:say">2022</button>
                        <button _="on click trigger radio:say">2023</button>
                        <button _="on click trigger radio:say">2024</button>
                        <button
                            class="down"
                            _="on click trigger radio:say"
                        >
                            2025
                        </button>
                    </div>
                </div>
            </div>

            <div id="layout-content">
                <div
                    id="card-item-accordion"
                    class="accordion"
                >
                    <th:block th:each="folder : ${folders}">
                        <div class="accordion-item collapsed">
                            <div
                                class="accordion-header"
                                _="on click send accordion:collapse to the next .accordion-body"
                            >
                                <span class="chevron-icon-16"></span>
                                <span
                                    th:text="${#temporals.format(folder.date, 'yyyy-MM-dd')}"
                                    >2019-02-03</span
                                >
                            </div>

                            <div
                                class="accordion-body"
                                _="install Collapsable(parent: the closest .accordion-item)"
                            >
                                <table class="card-table">
                                    <tr>
                                        <th></th>
                                        <th>Description</th>
                                        <th>
                                            <div>
                                                <span
                                                    class="chevron-icon-16"
                                                ></span>
                                                <span>Amount</span>
                                            </div>
                                        </th>
                                        <th>
                                            <div>
                                                <span
                                                    class="chevron-icon-16"
                                                ></span>
                                                <span>Action</span>
                                            </div>
                                        </th>
                                    </tr>

                                    <th:block
                                        th:each="card,it : ${folder.cards}"
                                    >
                                        <tr>
                                            <td th:text="${it.count}">1</td>
                                            <td th:text="${card.description}">
                                                Water 20L
                                            </td>
                                            <td
                                                th:text="|${#numbers.formatDecimal(card.amount, 1, 2, 'POINT')}|"
                                            >
                                                $10.00
                                            </td>
                                            <td>
                                                <span
                                                    hx-trigger="click"
                                                    th:hx-delete="|/hx/card/${card.id}|"
                                                    hx-target="closest table"
                                                    hx-swap="outerHTML"
                                                    >Delete</span
                                                >
                                            </td>
                                        </tr>
                                    </th:block>

                                    <tr>
                                        <td></td>
                                        <td>Total:</td>
                                        <td
                                            th:text="|${#numbers.formatDecimal(folder.amount, 1, 2, 'POINT')}|"
                                        >
                                            $10.00
                                        </td>
                                        <td></td>
                                    </tr>
                                </table>
                            </div>
                        </div>
                    </th:block>
                </div>
            </div>

            <div id="layout-footer"></div>
        </div>

        <div id="modal-root"></div>
    </body>

    <script
        type="text/javascript"
        th:src="@{~/js/lib/htmx.min.js}"
    ></script>
    <script
        type="text/javascript"
        th:src="@{~/js/lib/_hyperscript.min.js}"
    ></script>
    <script
        type="text/javascript"
        th:src="@{~/js/lib/toastify-js.js}"
    ></script>

    <script type="text/javascript">
        const base = {
            close: true,
            position: "left",
            gravity: "bottom",
            duration: 5000,
        };

        document.body.addEventListener("toastify:warn", (e) => {
            const config = Object.assign({}, base, {
                text: e?.detail?.message ?? "Something went wrong",
                className: "warn-toast",
            });

            Toastify(config).showToast();
        });

        document.body.addEventListener("toastify:success", (e) => {
            const config = Object.assign({}, base, {
                text: e?.detail?.message ?? "Operation was successful",
                className: "success-toast",
            });

            Toastify(config).showToast();
        });
    </script>
</html>
