<form
    th:object="${form}"
    autocomplete="off"
>
    <div class="form-group">
        <div>
            <label for="description">About</label>
        </div>

        <textarea
            th:field="description"
            rows="2"
            placeholder="What kind of card?"
        ></textarea>

        <div class="failures">
            <th:block th:each="error : *{errors('description')}">
                <span>
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <span th:text="${error}"></span>
                </span>
            </th:block>
        </div>
    </div>

    <div class="form-group">
        <div>
            <label for="amount">How much?</label>
        </div>

        <input
            th:field="amount"
            placeholder="0.00"
        />

        <div class="failures">
            <th:block th:each="error : *{errors('amount')}">
                <span>
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <span th:text="${error}"></span>
                </span>
            </th:block>
        </div>
    </div>

    <div class="form-group">
        <div>
            <label for="when">When?</label>
        </div>

        <input
            th:field="when"
            type="date"
        />
    </div>

    <div
        class="form-error-panel"
        th:if="${serverErrorsQ}"
    >
        <div>
            <i class="fa-solid fa-circle-exclamation"></i>
        </div>

        <div>
            Sorry, this is not working properly due internal server errors. Try
            again later, we are working to fix it.
        </div>
    </div>
</form>
