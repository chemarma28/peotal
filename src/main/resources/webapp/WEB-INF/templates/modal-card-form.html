<div
    class="modal"
    _="on modal:close add .fade-out then wait for animationend then remove me"
>
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <span>New Expense Card</span>
                </div>
            </div>
            <div class="modal-body">
                <form
                    id="card-form"
                    th:fragment="card-form"
                    f:vldclass="all"
                    autocomplete="off"
                    th:hx-post="@{~/hx/forms/card}"
                    hx-target="this"
                    hx-swap="outerHTML"
                >
                    <div
                        th:fragment="card-amount-detail"
                        class="field-detail"
                        hx-target="this"
                        f:vldclass="cardAmount"
                    >
                        <div class="field-control">
                            <label for="card-amount">Amount</label>
                            <input
                                id="card-amount"
                                f:field="cardAmount"
                                th:value="${cardAmount_v}"
                                placeholder="Amount..."
                                required
                                th:hx-get="@{~/hx/forms/card}"
                            />
                        </div>
                        <div class="field-errors">
                            <ul>
                                <li
                                    f:eachfail="fail of cardAmount"
                                    th:text="${fail}"
                                ></li>
                            </ul>
                        </div>
                    </div>

                    <div
                        class="field-detail"
                        th:fragment="card-date-detail"
                        f:vldclass="cardDate"
                        hx-target="this"
                    >
                        <div class="field-control">
                            <label for="card-date">Date</label>
                            <input
                                id="card-date"
                                f:field="cardDate"
                                th:value="${cardDate_v}"
                                type="date"
                                required
                                th:hx-get="@{~/hx/forms/card}"
                            />
                        </div>

                        <div class="field-errors"></div>
                    </div>

                    <div
                        th:fragment="card-description-detail"
                        class="field-detail"
                        f:vldclass="cardDescription"
                        hx-target="this"
                    >
                        <div class="field-control">
                            <label for="card-description">Description</label>
                            <textarea
                                id="card-description"
                                f:field="cardDescription"
                                th:text="${cardDescription_v}"
                                placeholder="Description..."
                                rows="3"
                                style="width: 268px; resize: none"
                                th:hx-get="@{~/hx/forms/card}"
                            ></textarea>
                        </div>
                        <div class="field-errors">
                            <ul>
                                <li
                                    f:eachfail="fail of cardDescription"
                                    th:text="${fail}"
                                ></li>
                            </ul>
                        </div>
                    </div>

                    <div
                        class="form-errors"
                        f:onfailvisible
                    >
                        Form submission failed. Ensure all fields are filled
                        correctly
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <div class="modal-control">
                    <button
                        class="btn"
                        _="on click trigger modal:close"
                    >
                        Cancel
                    </button>
                    <button
                        type="submit"
                        form="card-form"
                        class="btn btn-primary"
                    >
                        Save
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
