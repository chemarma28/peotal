<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>@account</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <link th:href="@{~/css/account.css}" rel="stylesheet">
</head>

<body>

<div id="content">
    <header>
        <div>
            <a>User</a>
        </div>

        <div>
            <a>May</a>
            <a>2026</a>
        </div>

        <div>
            <button>Make Expense</button>
            <button>Make Income</button>
        </div>
    </header>

    <main>
        <div id="dashboard">

        </div>

        <div id="details">
            <div class="accordion">
                <div class="accordion-item">
                    <div class="accordion-header">
                        <span class="chevron-icon-16"></span>
                        <span>2019-05-01</span>
                    </div>

                    <div class="accordion-main">
                        <table>
                            <tr>
                                <th>Description</th>
                                <th>Amount</th>
                                <th>Category</th>
                                <th>Actions</th>
                            </tr>

                            <tr>
                                <td>Pretty girls</td>
                                <td>$300</td>
                                <td>Fun</td>
                                <td>
                                    <a>Delete</a>
                                </td>
                            </tr>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        Fixed footer or something else
    </footer>
</div>

<div id="modal-root"></div>
</body>

<script type="text/javascript" th:src="@{~/js/lib/htmx.min.js}"></script>
<script type="text/javascript" th:src="@{~/js/lib/_hyperscript.min.js}"></script>
<script type="text/javascript" th:src="@{~/js/lib/toastify-js.js}"></script>
</html>
