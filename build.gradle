plugins {
    id 'application'
    id 'java'
}

version = "0.1.0"

def requiredJava = JavaVersion.VERSION_21
def currentJava = JavaVersion.current()

if (currentJava != requiredJava) {
    throw new GradleException(
            "Peotal requires JDK 21. " +
            "Current Gradle JVM: ${currentJava} " +
            "(${System.getProperty('java.version')}, ${System.getProperty('java.home')}). " +
            "Set JAVA_HOME to JDK 21 or configure Gradle JVM in your IDE."
    )
}

sourceSets {
    main {
        java {
            srcDirs = ["src"]
        }
        
        resources {
            srcDirs = ["src"]
            exclude "**/*.java"
        }
    }

    test {
        java {
            srcDirs = ["test"]
        }
    }
}

processResources {
    includeEmptyDirs = false
    
    from('db') {
        into 'db'
    }
}

application {
    mainClass = 'Launcher'
}

test {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-parameters']
    options.release = 21
}

repositories {
    mavenCentral()
    maven {
        url = uri("https://jitpack.io")
        content {
            includeGroup "com.github.chemarma28"
        }
    }
}

configurations {
    jvm2dts
}

dependencies {
    def joobyVersion = "4.5.4"

    implementation "com.h2database:h2:2.3.232"
    implementation "io.jooby:jooby:${joobyVersion}"
    implementation "io.jooby:jooby-netty:${joobyVersion}"
    implementation "io.jooby:jooby-logback:${joobyVersion}"
    implementation "io.jooby:jooby-flyway:${joobyVersion}"
    implementation "io.jooby:jooby-jdbi:${joobyVersion}"
    implementation "com.google.code.gson:gson:2.14.0"
    implementation "io.jooby:jooby-avaje-inject:${joobyVersion}"
	
    compileOnly "org.projectlombok:lombok:1.18.46"
	annotationProcessor "org.projectlombok:lombok:1.18.46"

    annotationProcessor "io.avaje:avaje-inject-generator:12.6"
    annotationProcessor "io.jooby:jooby-apt:${joobyVersion}"

	testCompileOnly "org.projectlombok:lombok:1.18.46"
	testAnnotationProcessor "org.projectlombok:lombok:1.18.46"

    testImplementation platform("org.junit:junit-bom:6.1.3")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation "org.assertj:assertj-core:3.27.7"

    jvm2dts "com.github.chemarma28:jvm2dts:b65f6646fa62b914a6e5798f2d083605cc409b1b"
}

jar {
    manifest {
        attributes "Main-Class": application.mainClass
    }

    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.register("types", JavaExec) {
    group = "build"
    description = "Generate ui/src/types.ts from Java model classes"

    dependsOn "classes"

    classpath = configurations.jvm2dts + sourceSets.main.runtimeClasspath
    mainClass = "jvm2dts.Main"

    def outputFile = layout.projectDirectory.file("ui/src/types.ts")
    def classesDir = layout.buildDirectory.dir("classes/java/main")

    args "-data-only",
         "-classesDir", classesDir.get().asFile.absolutePath,
         "categories", "transactions"

    standardOutput = new ByteArrayOutputStream()

    doLast {
        outputFile.asFile.setText(
                standardOutput.toString("UTF-8").replace("\r\n", "\n"),
                "UTF-8")
    }
}

tasks.named("classes") {
    finalizedBy "types"
}