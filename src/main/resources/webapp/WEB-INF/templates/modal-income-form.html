<div
    class="modal"
    _="on modal:close add .fade-out then wait for animationend then remove me"
>
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <span>New Income</span>
                </div>
            </div>
            <div class="modal-body">
                <form
                    id="income-form"
                    th:object="${incomeForm}"
                    th:fragment="income-form"
                    autocomplete="off"
                    th:hx-post="@{~/hx/forms/income}"
                    hx-target="this"
                    hx-swap="outerHTML"
                >
                    <div class="field-detail">
                        <div
                            class="field-control"
                            style="max-width: 140px"
                        >
                            <label for="incomeYear">Year</label>
                            <input
                                th:field="incomeYear"
                                type="number"
                                pattern="[0-9]{4}"
                                required
                                placeholder="When?"
                            />
                        </div>
                        <div class="field-errors">
                            <ul>
                                <li
                                    th:each="error : *{errors('incomeYear')}"
                                    th:text="${error}"
                                ></li>
                            </ul>
                        </div>
                    </div>

                    <div class="field-detail">
                        <div class="field-control">
                            <label for="incomeMonth">Month</label>
                            <select
                                th:field="incomeMonth"
                                required
                                style="min-height: 32px; max-width: 140px"
                            >
                                <option
                                    th:each="m : ${#numbers.sequence(1,12)}"
                                    th:value="${m}"
                                    th:text="${#calendars.monthName(#calendars.create(2000, m % 12, 1))}"
                                ></option>
                            </select>
                        </div>

                        <div class="field-errors">
                            <ul>
                                <li
                                    th:each="error : *{errors('incomeMonth')}"
                                    th:text="${error}"
                                ></li>
                            </ul>
                        </div>
                    </div>

                    <div
                        class="field-detail"
                        hx-target="this"
                        hx-swap="outerHTML"
                    >
                        <div class="field-control">
                            <label for="incomeAmount">Amount</label>
                            <input
                                th:field="incomeAmount"
                                placeholder="How much?"
                                required
                                style="max-width: 120px"
                            />
                        </div>
                        <div class="field-errors">
                            <ul>
                                <li
                                    th:each="error : *{errors('incomeAmount')}"
                                    th:text="${error}"
                                ></li>
                            </ul>
                        </div>
                    </div>

                    <div
                        th:if="not *{isValid}"
                        class="form-errors"
                    >
                        Form submission failed. Ensure all fields are correctly
                        filled.
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <div class="modal-control">
                    <button
                        class="btn"
                        _="on click trigger modal:close"
                    >
                        Cancel
                    </button>
                    <button
                        type="submit"
                        form="income-form"
                        class="btn btn-primary"
                    >
                        Save
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
